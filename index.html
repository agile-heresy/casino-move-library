<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Rueda de Casino Move Library</title>
    <link
      rel="stylesheet"
      href="assets/css/style.css"
    />
  </head>
  <body>
    <header class="site-header">
      <h1>Casino Move Library</h1>
      <p class="tagline">
        A reference library of Casino dance moves, organized by section and
        family, with video links.
      </p>
    </header>

    <main>
      <section class="controls">
        <input
          type="search"
          id="search-input"
          placeholder="Search moves..."
          aria-label="Search moves"
        />
        <select
          id="section-filter"
          aria-label="Filter by section"
        >
          <option value="all">All Sections</option>
        </select>
        <select
          id="category-filter"
          aria-label="Filter by family"
        >
          <option value="all">All Families</option>
        </select>
      </section>

      <section
        id="move-grid"
        class="move-grid"
        aria-live="polite"
      ></section>
      <p
        id="empty-state"
        class="empty-state"
        hidden
      >
        No moves match your filters.
      </p>
    </main>

    <footer class="site-footer">
      <p>
        Moves are listed in <a href="data/moves.json">data/moves.json</a> — add
        your own by editing that file.
      </p>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
